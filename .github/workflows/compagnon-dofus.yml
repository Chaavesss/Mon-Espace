name: Compagnon Dofus indépendant
on:
  push:
    branches: [main]
    paths:
      - 'standalone/dofus/**'
      - '.github/workflows/compagnon-dofus.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-compagnon-dofus
  cancel-in-progress: false
jobs:
  standalone:
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Compiler uniquement le compagnon
        shell: powershell
        run: ./standalone/dofus/build.ps1
      - name: Verifier stockage et interface WPF
        shell: powershell
        run: |
          $exe = Join-Path $pwd 'dist-compagnon/CompagnonDofus.exe'
          $results = Join-Path $pwd 'test-results/compagnon'
          $p = Start-Process $exe -ArgumentList @('--self-test', ('"' + $results + '"')) -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content (Join-Path $results 'FAIL.txt'); throw 'Companion tests failed' }
          if (!(Test-Path (Join-Path $results 'PASS.txt'))) { throw 'Missing test report' }
          Get-Content (Join-Path $results 'PASS.txt')
      - name: Archiver les controles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controles-compagnon-dofus
          path: test-results/compagnon
      - name: Preparer et publier
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $pwd 'dist-compagnon/package'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item dist-compagnon/CompagnonDofus.exe $stage
          Copy-Item standalone/dofus/LIRE_MOI.txt,standalone/dofus/Installer_Compagnon_Dofus.cmd $stage
          $zip = Join-Path $pwd 'dist-compagnon/CompagnonDofus.zip'
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $pwd 'dist-compagnon/SHA256.txt'), ($hash + '  CompagnonDofus.zip'))
          $tag = 'compagnon-dofus-v1.0.0'
          $existing = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect releases' }
          if ($existing | Where-Object tagName -eq $tag) { throw 'Companion version already exists; increment before publishing' }
          gh release create $tag $zip dist-compagnon/SHA256.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Compagnon Dofus indépendant 1.0' --notes-file standalone/dofus/RELEASE_NOTES.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create companion release' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish companion release' }
